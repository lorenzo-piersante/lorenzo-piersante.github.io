<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/lorem-ipsum-generator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="profile">
            <img src="../assets/images/avatar.jpg" alt="Lorenzo Piersante" class="avatar">
            <h1>Lorenzo Piersante</h1>
            <p class="description">Building my own little website, work in progress...</p>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">
                        <i class="fa-solid fa-house"></i>
                        HOME
                    </a>
                </li>
                <li>
                    <a href="../articles.html">
                        <i class="fa-solid fa-pen-clip"></i>
                        ARTICLES
                    </a>
                </li>
                <li>
                    <a href="../tools.html" class="active">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        TOOLS
                    </a>
                </li>
                <li>
                    <a href="../about.html">
                        <i class="fa-solid fa-circle-info"></i>
                        ABOUT
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-bottom">
            <a href="https://github.com/lorenzo-piersante" target="_blank" aria-label="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://linkedin.com/in/lorenzopiersante" target="_blank" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin"></i>
            </a>
        </div>
    </aside>

    <main class="content">
        <div class="main-column">
            <div class="page-header">
                <a href="../tools.html" class="breadcrumb-link">Tools</a> / Lorem Ipsum Generator
            </div>

            <div class="tool-display-container lorem-tool">
                <div class="lorem-header">
                    <i class="fa-solid fa-paragraph tool-display-icon"></i>
                    <h2>Lorem Ipsum Generator</h2>
                    <p>Generate placeholder text for your designs and layouts.</p>
                </div>

                <div class="form-group">
                    <label>Size</label>
                    <div class="radio-group lorem-size-options">
                        <label class="radio-option">
                            <input type="radio" name="size" value="S">
                            S (1 paragraph)
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="size" value="M" checked>
                            M (2 paragraphs)
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="size" value="L">
                            L (3 paragraphs)
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="size" value="XL">
                            XL (4 paragraphs)
                        </label>
                    </div>
                </div>

                <div class="button-group">
                    <button id="generate-button" class="action-button primary">
                        <i class="fa-solid fa-rotate"></i>
                        Generate
                    </button>
                </div>

                <div id="lorem-output" class="lorem-output" aria-live="polite"></div>

                <button id="copy-button" class="copy-button lorem-copy-button">
                    <i class="fa-regular fa-copy"></i>
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </main>
</div>

<script src="../assets/js/lorem-ipsum-generator.js" defer></script>
